name: Build Verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-build-placeholder
          OPENAI_API_KEY: local-build-placeholder
          OCR_API_KEY: local-build-placeholder
          OCR_API_URL: https://example.invalid/ocr
